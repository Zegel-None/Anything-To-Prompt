[package]
name = "anything-to-prompt"
version = "0.7.1"
description = "Anything-to-Prompt — Pick anything on your Windows desktop, straight into your AI prompt"
authors = ["Anything-to-Prompt Contributors"]
edition = "2021"

[lib]
name = "anything_to_prompt_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
tauri = { version = "2.12.7", features = ["custom-protocol", "tray-icon", "image-png"] }
tauri-plugin-single-instance = "2.5.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
log = "0.4"
simplelog = "0.12.2"
dirs = "6.0"
base64 = "0.22"
url = "2.5"
image = { version = "0.25", default-features = false, features = ["png"] }
ignore = "0.4"
nucleo-matcher = "0.3"
pinyin = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
uiautomation = "0.25.3"
wmi = "0.18.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_NetworkManagement_IpHelper",
  "Win32_Networking_WinSock",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_IO",
  "Win32_System_Ioctl",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Pipes",
  "Win32_System_ProcessStatus",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_HiDpi",
  "Win32_UI_Input",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
] }
